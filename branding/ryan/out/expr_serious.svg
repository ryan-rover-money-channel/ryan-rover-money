    <path d="M964 455 Q946 500 954 510 Q970 516 982 508" fill="none" stroke-width="5"/>
    <!-- cheek tone -->
    <ellipse cx="868" cy="522" rx="22" ry="11" fill="#EE9C86" opacity="0.30" stroke="none"/>
    <ellipse cx="1052" cy="522" rx="22" ry="11" fill="#EE9C86" opacity="0.30" stroke="none"/>
  </g>
