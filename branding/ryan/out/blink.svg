<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2F0"/><stop offset="1" stop-color="#D5E2DA"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE6F5"/><stop offset="1" stop-color="#EAF4FA"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- office window with skyline -->
  <g stroke="#1B1B1F" stroke-width="5" stroke-linejoin="round">
    <rect x="150" y="150" width="420" height="420" rx="8" fill="url(#sky)"/>
    <g stroke="none"><rect x="165" y="350" width="60" height="210" fill="#9FB3C8"/><rect x="232" y="270" width="45" height="290" fill="#9FB3C8"/><rect x="284" y="390" width="70" height="170" fill="#9FB3C8"/><rect x="362" y="230" width="50" height="330" fill="#9FB3C8"/><rect x="420" y="330" width="65" height="230" fill="#9FB3C8"/><rect x="492" y="280" width="55" height="280" fill="#9FB3C8"/></g>
    <path d="M360 150 L360 570 M150 360 L570 360" fill="none" stroke-width="8" stroke="#F7F7F5"/>
    <rect x="150" y="150" width="420" height="420" rx="8" fill="none"/>
  </g>
  <!-- chart frame right -->
  <g stroke="#1B1B1F" stroke-width="5" stroke-linejoin="round" fill="none">
    <rect x="1390" y="170" width="360" height="250" rx="14" fill="#FFFFFF"/>
    <path d="M1430 380 L1500 340 L1560 355 L1630 280 L1710 215" stroke="#2FA36B" stroke-width="10" stroke-linecap="round"/>
    <path d="M1690 210 L1714 212 L1708 236" stroke="#2FA36B" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- plant -->
  <g stroke="#1B1B1F" stroke-width="5" stroke-linejoin="round">
    <path d="M1560 760 Q1500 640 1530 560 Q1580 640 1575 760 Z" fill="#2FA36B"/>
    <path d="M1590 760 Q1620 620 1700 590 Q1680 690 1605 760 Z" fill="#3CB97C"/>
    <path d="M1530 760 L1650 760 L1630 870 L1550 870 Z" fill="#E7DCC9"/>
  </g>

  <g stroke="#1B1B1F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- suit jacket: tailored, square shoulders -->
    <path d="M615 1100 L625 820 Q630 768 675 752
             L850 708 Q960 700 1070 708 L1245 752
             Q1290 768 1295 820 L1305 1100 Z" fill="#2B3245"/>
    <path d="M698 1100 L692 860" fill="none" stroke="#1E2433" stroke-width="8"/>
    <path d="M1222 1100 L1228 860" fill="none" stroke="#1E2433" stroke-width="8"/>
    <!-- neck -->
    <path d="M888 640 L884 722 Q960 760 1036 722 L1032 640 Z" fill="#DFAA8A"/>
    <!-- shirt -->
    <path d="M848 712 L960 1100 L1072 712 Q960 745 848 712 Z" fill="#F4F2EC"/>
    <!-- tie -->
    <path d="M934 742 L986 742 L978 778 L942 778 Z" fill="#1E7A50"/>
    <path d="M942 778 L978 778 L1000 990 L960 1030 L920 990 Z" fill="#1E7A50"/>
    <path d="M952 800 L988 900" fill="none" stroke="#2A9A67" stroke-width="6" opacity="0.7"/>
    <!-- shirt collar -->
    <path d="M880 705 L932 742 L900 790 L860 722 Z" fill="#F4F2EC"/>
    <path d="M1040 705 L988 742 L1020 790 L1060 722 Z" fill="#F4F2EC"/>
    <!-- lapels -->
    <polygon points="850 712 938 925 880 940 795 815 832 795 782 735" fill="#1E2433"/>
    <polygon points="1070 712 982 925 1040 940 1125 815 1088 795 1138 735" fill="#1E2433"/>
    <!-- pocket square -->
    <path d="M1130 880 L1205 880 L1192 854 L1170 867 L1154 850 Z" fill="#2FA36B"/>
    <path d="M1120 880 L1215 880" fill="none"/>
    <!-- buttons -->
    <circle cx="990" cy="1050" r="8" fill="#1E2433"/>
  </g>
<g transform="translate(0 25) translate(960 450) scale(1.15) translate(-960 -450)">
  <g stroke="#1B1B1F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
