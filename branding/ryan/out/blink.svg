    <path d="M964 455 Q946 500 954 510 Q970 516 982 508" fill="none" stroke-width="5"/>
    <!-- cheek tone -->
    <ellipse cx="868" cy="505" rx="20" ry="9" fill="#EE9C86" opacity="0.30" stroke="none"/>
    <ellipse cx="1052" cy="505" rx="20" ry="9" fill="#EE9C86" opacity="0.30" stroke="none"/>
  </g>
